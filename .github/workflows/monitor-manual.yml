name: 带单与Bitget动态监控（Cloudflare每5分钟触发）

on:
  workflow_dispatch:
    inputs:
      preview_ui:
        description: "只发送通知样式预览，不修改监控状态"
        required: false
        default: false
        type: boolean
      preview_topic:
        description: "预览消息指定群组编码；留空时使用全部群组"
        required: false
        default: ""
        type: string
      bitget_dry_run:
        description: "只测试Bitget读取并打印通知，不推送微信、不修改正式状态"
        required: false
        default: false
        type: boolean
      bitget_only:
        description: "只运行Bitget正式监控，跳过原有币安监控"
        required: false
        default: false
        type: boolean
permissions:
  contents: read

concurrency:
  group: binance-copy-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 读取仓库
        uses: actions/checkout@v5

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: 恢复上一次公开状态
        uses: actions/cache/restore@v5
        with:
          path: |
            .state/monitor.json
            .state/bitget-insights.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-

      - name: 运行只读监控
        if: ${{ github.event.inputs.bitget_dry_run != 'true' && github.event.inputs.bitget_only != 'true' }}
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PREVIEW_UI: ${{ github.event.inputs.preview_ui || 'false' }}
          PREVIEW_TOPIC: ${{ github.event.inputs.preview_topic || '' }}
        run: npm run monitor

      - name: 监控Bitget公开挂单动态
        if: ${{ always() && github.event.inputs.preview_ui != 'true' }}
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.bitget_dry_run || 'false' }}
          BITGET_STATE_PATH: ${{ github.event.inputs.bitget_dry_run == 'true' && '/tmp/bitget-insights-test.json' || '.state/bitget-insights.json' }}
        run: npm run monitor:bitget

      - name: 保存本次公开状态
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            .state/monitor.json
            .state/bitget-insights.json
          key: monitor-state-${{ github.run_id }}
